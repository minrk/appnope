[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "appnope"
version = "0.2.0"
description = "Disable App Nap on macOS >= 10.9"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.9"
authors = [
    {name = "Min Ragan-Kelley", email = "benjaminrk@gmail.com"},
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]

[project.urls]
Source = "https://github.com/minrk/appnope"


[tool.tbump]
github_url = "https://github.com/minrk/appnope"

[tool.tbump.version]
current = "0.2.0"
regex = '''
    (?P<major>\d+)
    \.
    (?P<minor>\d+)
    \.
    (?P<patch>\d+)
    (?P<pre>((a|b|rc)\d+)|)
    \.?
    (?P<dev>(?<=\.)dev\d*|)
'''

[tool.tbump.git]
message_template = "Bump to {new_version}"
tag_template = "{new_version}"

[[tool.tbump.file]]
src = "pyproject.toml"

[[tool.tbump.file]]
src = "appnope/__init__.py"
